<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e2e7ec" />
    <meta name="description" content="A local-first operations workspace for AI agents." />
    <title>Utu</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("utu.theme") || "system";
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#171e26" : "#e2e7ec");
        } catch (e) {}
      })();
    </script>
    <link data-trunk rel="css" href="styles.css" />
    <link data-trunk rel="copy-file" href="static/favicon.svg" />
    <link data-trunk rel="copy-file" href="src-tauri/icons/app-icon.svg" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>
  <body>

</html>
